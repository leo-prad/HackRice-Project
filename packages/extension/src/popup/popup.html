<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GitQuest</title><style>
*{box-sizing:border-box}body{margin:0;width:350px;min-height:300px;background:#080a10;color:#edf2f7;font:13px Inter,system-ui,sans-serif}#app{padding:18px}.brand{display:flex;align-items:center;gap:10px;margin-bottom:18px}.mark{display:grid;place-items:center;width:31px;height:31px;border-radius:9px;background:#b8f254;color:#071006;font-weight:950;font-size:18px}.brand b{font-size:15px}.muted{color:#778296}.login{text-align:center;padding:32px 8px}.login h2{font-size:22px;margin:0 0 8px}.login p{color:#7d889a;line-height:1.5}.code{width:100%;padding:12px;border:1px solid #242a36;background:#10141e;color:white;border-radius:9px;text-align:center;text-transform:uppercase;font:700 14px ui-monospace,monospace;letter-spacing:.08em}.button{display:block;width:100%;margin-top:9px;padding:11px;border:0;border-radius:9px;background:#b8f254;color:#091006;font-weight:850;cursor:pointer;text-align:center;text-decoration:none}.ghost{background:#171c27;color:#d4dbe7}.error{color:#f99191;font-size:11px}.user{display:flex;align-items:center;gap:11px}.avatar{width:42px;height:42px;border-radius:50%;border:2px solid #b8f254}.user strong{display:block;font-size:15px}.level{font:700 10px ui-monospace,monospace;color:#b8f254}.bar{height:5px;background:#1d2230;border-radius:9px;margin:12px 0 19px;overflow:hidden}.bar i{display:block;height:100%;background:#b8f254}.section{border-top:1px solid #1a1f2a;padding-top:14px;margin-top:14px}.section h3{margin:0 0 10px;font-size:10px;letter-spacing:.12em;color:#687487}.row{display:flex;align-items:center;gap:9px;margin:9px 0}.row img{width:25px;height:25px;border-radius:50%}.row .name{min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.xp{font:750 11px ui-monospace,monospace;color:#b8f254}.rank{width:17px;color:#697487;font:700 10px ui-monospace,monospace}.footer{display:block;margin:17px -18px -18px;padding:13px;text-align:center;border-top:1px solid #1a1f2a;color:#9ca7b8;text-decoration:none}.empty{font-size:11px;color:#5f6a7b}.quests{display:flex;flex-direction:column;gap:8px}.quest{display:block;padding:10px 12px;border:1px solid #242a36;border-radius:8px;background:#10141e;color:#edf2f7;text-decoration:none;transition:border-color .12s,background .12s,transform .12s}.quest:hover{border-color:#b8f254;background:#141a26;transform:translateY(-1px)}.quest:focus-visible{outline:2px solid #b8f254;outline-offset:2px}.quest-meta{display:flex;align-items:center;gap:6px;color:#8a94a6;font:600 10px ui-monospace,monospace;letter-spacing:.04em}.quest-icon{width:10px;height:10px;border-radius:50%;border:2px solid #4ade80;background:transparent;display:inline-block}.quest-slug{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.quest-title{margin-top:4px;font-size:12.5px;font-weight:600;line-height:1.35;color:#edf2f7;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.quest-foot{display:flex;justify-content:space-between;align-items:center;margin-top:6px}.quest-xp{font:700 11px ui-monospace,monospace;color:#b8f254}.quest-open{font:600 10px ui-monospace,monospace;color:#697487;letter-spacing:.06em}.quest:hover .quest-open{color:#b8f254}
</style></head><body><div id="app"><div class="brand"><div class="mark">Q</div><b>GitQuest</b></div><div class="muted">Loading quests…</div></div><script type="module" src="./popup.ts"></script></body></html>
