services:
  - type: web
    name: questline-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build -w @questline/shared && npm run build -w @questline/server && npm run migrate -w @questline/server
    startCommand: npm run start -w @questline/server
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DASHBOARD_URL
        value: https://questline-dashboard.onrender.com
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_OAUTH_CALLBACK
        value: https://questline-api-p6u3.onrender.com/auth/github/callback
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: DEMO_REPOS
        sync: false
      - key: USE_GOAL_REPO_MAP
        sync: false

  - type: web
    name: questline-dashboard
    runtime: static
    rootDir: .
    buildCommand: npm install && npm run build -w @questline/shared && npm run build -w @questline/dashboard
    staticPublishPath: packages/dashboard/dist
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: VITE_API_BASE_URL
        value: https://questline-api-p6u3.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
